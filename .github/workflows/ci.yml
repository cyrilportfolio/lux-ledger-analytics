name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Regenerate the synthetic datasets
        run: python -m src.generate_data
      - name: Run the test suite
        run: python -m pytest
      - name: Run the pipeline end to end
        run: python -m src.main --journal data/journal_clean.csv --faia --silencieux
